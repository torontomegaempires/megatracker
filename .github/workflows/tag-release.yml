# When a merged change bumps the version in package.json (a release PR), tags vX.Y.Z on main
# and moves the production branch to it. Netlify deploys the production branch to
# megatracker.torontomegaempires.com, so the live site only changes when a release merges;
# main itself deploys to the staging site.
name: Tag release

on:
  push:
    branches: [main]
    paths: [package.json]
  # Run it by hand (Actions > Tag release > Run workflow) to finish a release whose run failed:
  # it tags main's version if needed and moves production to it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    # Only main is released: a manual run started from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the runner has production's commit and git can see that moving
          # it to the new tag is a fast-forward. A shallow clone has only the tip, and git
          # then refuses the push ("fetch first") whenever production already exists.
          fetch-depth: 0
      - name: Tag the new version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "Tagged $tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Release it to production
        # Not forced: production only ever moves forward, to a release that contains it.
        run: |
          git push origin "$TAG^{commit}:refs/heads/production"
          echo "production is now at $TAG"
