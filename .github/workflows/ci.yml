name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check changelog entries are under Unreleased
        # Release PRs rename [Unreleased] on purpose, so they are skipped.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: node scripts/check-changelog.mjs HEAD^1
      - run: npm ci
      - run: npm test
      - run: npm run build
